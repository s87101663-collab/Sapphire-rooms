<!DOCTYPE html>

        .details {

        }
        .footer-locations {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 20px;
            font-size: 0.9em;

        }

<body>
<div class="container">

            <p class="copyright">&copy; सफायर रूम्स (Sapphire Rooms)</p>
